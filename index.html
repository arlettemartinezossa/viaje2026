const CKEY = 'magallanes2026-codigo';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = c => String(c || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
async function abrir(code) {
  const c = norm(code); if (!c || !(window.crypto && crypto.subtle)) return null;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(c), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(B.salt), iterations: B.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  for (const w of B.wraps) {
    try {
      const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(w.iv) }, k, b64(w.ct));
      const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(B.iv) }, key, b64(B.ct));
      return new TextDecoder().decode(pt);
    } catch (e) {}
  }
  return null;
}

  const code = document.getElementById('c').value.trim(); if (!code) return;
  msg('Abriendo…');
  const html = await abrir(code);
  if (!html) { msg(window.crypto && crypto.subtle ? 'Código incorrecto.' : 'Este navegador no permite abrir el sitio (usa https).'); return; }
  try { localStorage.setItem(CKEY, code); } catch (e) {}
  mostrar(html);
});
(async () => {
  let saved = ''; try { saved = localStorage.getItem(CKEY) || ''; } catch (e) {}
  if (!saved) return;
  msg('Abriendo…');
  const html = await abrir(saved);
  if (html) mostrar(html); else msg('');
})();
