  const c = norm(code); if (!c || !(window.crypto && crypto.subtle)) return null;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(c), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(B.salt), iterations: B.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  for (const w of B.wraps) {
    try {
      const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(w.iv) }, k, b64(w.ct));
      const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(B.iv) }, key, b64(B.ct));
      return new TextDecoder().decode(pt);
    } catch (e) {}
  }
  return null;
}
function mostrar(html) { document.open(); document.write(html); document.close(); }
const msg = t => { document.getElementById('msg').textContent = t; };

});
